<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a73e8">
  <meta name="description" content="Risultati sportivi in tempo reale - Calcio, Basket, Formula 1">
  <title>SportLive – Risultati in Tempo Reale</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- HEADER -->
  <header class="header" id="header">
    <button class="hamburger" id="hamburger" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>

    <div class="logo">
      <span class="logo-icon">⚽</span>
      <span class="logo-name">Sport<span class="logo-live">Live</span></span>
    </div>

    <nav class="sport-tabs" id="sport-tabs">
      <button class="sport-tab active" data-sport="football">
        <span class="tab-icon">⚽</span><span class="tab-label">Calcio</span>
      </button>
      <button class="sport-tab" data-sport="basketball">
        <span class="tab-icon">🏀</span><span class="tab-label">Basket</span>
      </button>
      <button class="sport-tab" data-sport="f1">
        <span class="tab-icon">🏎️</span><span class="tab-label">Formula 1</span>
      </button>
      <button class="sport-tab" data-sport="news">
        <span class="tab-icon">📰</span><span class="tab-label">Notizie</span>
      </button>
    </nav>

    <div class="header-right">
      <div class="live-pill" id="live-pill">
        <span class="live-dot"></span><span>LIVE</span>
      </div>
      <button class="notif-btn" id="notif-btn" title="Notifiche">🔔</button>
      <span class="refresh-label" id="refresh-label">15s</span>
    </div>
  </header>

  <!-- MOBILE SPORT BAR -->
  <div class="mobile-sport-bar" id="mobile-sport-bar">
    <button class="msport-btn active" data-sport="football">⚽ Calcio</button>
    <button class="msport-btn" data-sport="basketball">🏀 Basket</button>
    <button class="msport-btn" data-sport="f1">🏎️ F1</button>
    <button class="msport-btn" data-sport="news">📰 Notizie</button>
  </div>

  <!-- SIDEBAR OVERLAY (mobile) -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <!-- LAYOUT -->
  <div class="layout">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title">Competizioni</div>
        <button class="sidebar-close" id="sidebar-close">✕</button>
      </div>
      <div class="sidebar-search">
        <input type="search" id="league-search" placeholder="Cerca competizione…" autocomplete="off">
      </div>
      <nav class="league-nav" id="league-nav"></nav>
    </aside>

    <!-- MAIN -->
    <main class="main">
      <div class="content-header" id="content-header">
        <div class="content-header-left">
          <h2 class="page-title" id="page-title">Champions League</h2>
          <button class="fav-btn" id="fav-btn" title="Aggiungi ai preferiti">☆</button>
        </div>
        <div class="view-tabs" id="view-tabs">
          <button class="view-tab active" data-view="scores">Risultati</button>
          <button class="view-tab" data-view="standings">Classifica</button>
          <button class="view-tab" data-view="scorers">Marcatori</button>
        </div>
      </div>

      <div id="content">
        <div class="loading-state">
          <div class="spinner"></div>
          <p>Caricamento…</p>
        </div>
      </div>
    </main>
  </div>

  <!-- FOOTER -->
  <footer class="footer">
    <span>Dati: ESPN · Jolpica F1</span>
    <span id="updated-at">—</span>
  </footer>

  <!-- MATCH DETAIL MODAL -->
  <div class="modal-backdrop" id="modal-backdrop">
    <div class="modal" id="match-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-header">
        <h3 class="modal-title" id="modal-title">Dettaglio Partita</h3>
        <button class="modal-close" id="modal-close" aria-label="Chiudi">✕</button>
      </div>
      <div class="modal-score-banner" id="modal-score-banner"></div>
      <div class="modal-tabs">
        <button class="modal-tab active" data-mtab="events">📋 Cronaca</button>
        <button class="modal-tab" data-mtab="lineups">👥 Formazioni</button>
        <button class="modal-tab" data-mtab="stats">📊 Statistiche</button>
        <button class="modal-tab" data-mtab="tv">📺 TV</button>
      </div>
      <div class="modal-body" id="modal-body">
        <div class="loading-state"><div class="spinner"></div><p>Caricamento…</p></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
